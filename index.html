                "@type": "Answer",

                "text": "La Resolución 4272 de 2021 del Ministerio del Trabajo derogó la Resolución 1409 de 2012 y entró en vigor el 27 de junio de 2022. Exige coordinador certificado de alturas en obras con trabajos a 2 metros o más, planes de rescate documentados y EPP con certificación ANSI/ASSE Z359 o EN 361. Todos los equipos deben retirarse del servicio tras sufrir una caída. Fuente: Resolución 4272 de 2021 — Alcaldía Mayor de Bogotá / SISJUR."
